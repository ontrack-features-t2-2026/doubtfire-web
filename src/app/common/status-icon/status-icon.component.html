<div
  class="status-chip mx-0.5 flex size-[30px] shrink-0 items-center justify-center rounded-full"
  matTooltip="{{ statusLabel }}"
  matTooltipPosition="above"
  role="img"
  style="font-size: 14px"
  [attr.aria-label]="statusLabel"
  [matTooltipDisabled]="!showTooltip"
  [ngClass]="statusClass"
>
  <mat-icon
    aria-hidden="true"
    class="m-0 scale-75 place-self-center"
    [ngClass]="{'font-black': resolvedStatus === 'complete'}"
    >{{ statusIcon }}</mat-icon
  >
</div>
