<section class="notification-settings" fxFlexFill fxLayout="column">
  <h3>Notification Settings</h3>

  <p class="notification-settings__intro">
    Choose which notification categories you want to receive.
  </p>

  <div class="notification-setting">
    <mat-checkbox
      color="primary"
      name="task_n"
      [(ngModel)]="user.receiveTaskNotifications"
      [ngModelOptions]="{standalone: true}"
    >
      Task notifications
    </mat-checkbox>
    <small>Receive notifications for task-related events.</small>
  </div>

  <div class="notification-setting">
    <mat-checkbox
      color="primary"
      name="feedback_n"
      [(ngModel)]="user.receiveFeedbackNotifications"
      [ngModelOptions]="{standalone: true}"
    >
      Feedback notifications
    </mat-checkbox>
    <small>Receive notifications for feedback-related events.</small>
  </div>

  <div class="notification-setting">
    <mat-checkbox
      color="primary"
      name="portfolio_n"
      [(ngModel)]="user.receivePortfolioNotifications"
      [ngModelOptions]="{standalone: true}"
    >
      Portfolio notifications
    </mat-checkbox>
    <small>Receive notifications for portfolio-related events.</small>
  </div>
</section>
