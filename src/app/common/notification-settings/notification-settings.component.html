<section class="notification-settings" fxFlexFill fxLayout="column">
  <h3>Notification settings</h3>

  <p class="notification-settings__intro">
    Choose which notification categories you want to receive.
  </p>

  <div class="notification-setting">
    <mat-checkbox
      aria-describedby="task-notification-description"
      color="primary"
      [ngModelOptions]="{standalone: true}"
      [(ngModel)]="user.receiveTaskNotifications"
    >
      Task notifications
    </mat-checkbox>
    <small class="notification-setting__help" id="task-notification-description">
      Due dates, changed dates, and task status updates.
    </small>
  </div>

  <div class="notification-setting">
    <mat-checkbox
      aria-describedby="feedback-notification-description"
      color="primary"
      [ngModelOptions]="{standalone: true}"
      [(ngModel)]="user.receiveFeedbackNotifications"
    >
      Feedback notifications
    </mat-checkbox>
    <small class="notification-setting__help" id="feedback-notification-description">
      New comments, feedback, and review outcomes.
    </small>
  </div>

  <div class="notification-setting">
    <mat-checkbox
      aria-describedby="portfolio-notification-description"
      color="primary"
      [ngModelOptions]="{standalone: true}"
      [(ngModel)]="user.receivePortfolioNotifications"
    >
      Portfolio notifications
    </mat-checkbox>
    <small class="notification-setting__help" id="portfolio-notification-description">
      Portfolio processing and assessment updates.
    </small>
  </div>
</section>
