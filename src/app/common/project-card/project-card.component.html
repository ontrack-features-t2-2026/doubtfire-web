@if (project) {
  <article class="project-card">
    <div class="project-card__header">
      <div>
        @if (project.unitCode) {
          <p class="project-card__unit">{{ project.unitCode }}</p>
        }
        <h3 class="project-card__title">{{ project.title }}</h3>
      </div>

      <span aria-label="Project status" class="project-card__status">
        {{ project.status }}
      </span>
    </div>

    <p class="project-card__summary">
      {{ project.progressSummary }}
    </p>

    @if (project.description) {
      <p class="project-card__description">
        {{ project.description }}
      </p>
    }

    <a aria-label="Open project details" class="project-card__link" [href]="project.destinationUrl">
      Open project
    </a>
  </article>
}
