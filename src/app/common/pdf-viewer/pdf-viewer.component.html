<div #pdfContainer id="pdfContainer">
  <div id="actionBar">
    <div id="pdfViewActions" [hidden]="!pdfBlobUrl">
      <button aria-label="Switch viewer" mat-icon-button (click)="toggleNativePdfViewer()">
        @if (useNativePdfViewer) {
          <mat-icon>toggle_on</mat-icon>
        } @else {
          <mat-icon>toggle_off</mat-icon>
        }
      </button>
      <button aria-label="Download pdf" mat-icon-button (click)="downloadPdf()">
        <mat-icon>download</mat-icon>
      </button>
    </div>

    <div class="pdf-actions-end">
      <!-- A plain pill rather than an outlined form field: the field's outline is
           drawn in pieces around a notch for a floating label, and restyling the
           pieces into a pill left a broken curve beside the search icon. -->
      <div
        class="pdf-search"
        id="pdfActions"
        role="search"
        [hidden]="!loaded || useNativePdfViewer"
      >
        <mat-icon aria-hidden="true" class="pdf-search__icon">search</mat-icon>
        <input
          aria-label="Search PDF"
          autocomplete="off"
          class="pdf-search__input"
          placeholder="Search PDF"
          spellcheck="false"
          type="search"
          [(ngModel)]="pdfSearchString"
          (ngModelChange)="searchPdf(pdfSearchString)"
        />
        <span aria-hidden="true" class="pdf-search__divider"></span>
        <button
          aria-label="Zoom out"
          class="pdf-toolbar-button"
          mat-icon-button
          type="button"
          (click)="zoomOut()"
        >
          <mat-icon>zoom_out</mat-icon>
        </button>
        <button
          aria-label="Zoom in"
          class="pdf-toolbar-button"
          mat-icon-button
          type="button"
          (click)="zoomIn()"
        >
          <mat-icon>zoom_in</mat-icon>
        </button>
      </div>

      @if (canFullscreen && pdfBlobUrl) {
        <button
          aria-label="Full screen"
          class="pdf-fullscreen-button"
          mat-icon-button
          type="button"
          [attr.aria-pressed]="isFullscreen"
          (click)="toggleFullscreen()"
        >
          <mat-icon>{{ isFullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
      }
    </div>
  </div>

  @if (pdfBlobUrl) {
    @if (useNativePdfViewer) {
      @if (pdfBlobUrl) {
        <object title="Submission PDF" type="application/pdf" [data]="pdfBlobUrl | safe">
          PDF Preview
        </object>
      }
    } @else {
      <pdf-viewer
        [original-size]="false"
        [render-text]="true"
        [show-all]="true"
        [src]="pdfBlobUrl"
        [zoom]="zoomValue"
        [(page)]="pageNumber"
        (after-load-complete)="onLoaded($event)"
        (text-layer-rendered)="onTextLayerRendered()"
      ></pdf-viewer>
    }
  } @else {
    <mat-spinner
      aria-label="Loading PDF"
      color="accent"
      diameter="100"
      strokeWidth="2"
    ></mat-spinner>
  }
</div>
