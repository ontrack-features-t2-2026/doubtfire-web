<div>
  <!-- <df-unit-tutorials-list [unit]="unit"></df-unit-tutorials-list> -->
  @for (stream of unit.tutorialStreams; track stream) {
    <df-unit-tutorials-list [stream]="stream" [unit]="unit"></df-unit-tutorials-list>
  } @empty {
    <f-empty-state
      heading="No tutorials yet"
      icon="groups"
      message="Create a tutorial stream to begin adding tutorials."
    ></f-empty-state>
  }
  <div class="mt-3 flex w-full justify-center">
    <button class="mx-auto" color="primary" mat-raised-button [matMenuTriggerFor]="activities">
      <mat-icon>add</mat-icon>
      New Tutorial Stream
    </button>
  </div>

  <mat-menu #activities="matMenu">
    @for (activityType of activityTypes; track activityType) {
      <button mat-menu-item (click)="onClickNewActivity(activityType)">
        <span>{{ activityType.name }}</span>
      </button>
    }
  </mat-menu>
</div>
