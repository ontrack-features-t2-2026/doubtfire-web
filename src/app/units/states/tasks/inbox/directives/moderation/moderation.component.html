<!-- <div class="flex justify-center py-1">Tutor: {{ task.tutor?.user.name }}</div> -->
<span class="center-buttons mx-3 flex justify-around gap-3">
  @if (task.moderationType === 'random_sample' || task.moderationType === 'first_feedback') {
    <button
      aria-label="Show more from this tutor"
      class="button"
      mat-icon-button
      matTooltip="Show more from this tutor"
      matTooltipPosition="above"
      [disabled]="task === undefined || isModerated(task)"
      (click)="showMore()"
    >
      <mat-icon>flag</mat-icon>
    </button>
    <button
      aria-label="Snooze task"
      class="button large-button"
      mat-icon-button
      matTooltip="Snooze task"
      matTooltipPosition="above"
      [disabled]="task === undefined || isModerated(task)"
      (click)="snooze()"
    >
      <mat-icon>snooze</mat-icon>
    </button>
    <button
      aria-label="Dismiss moderation task"
      class="button large-button"
      mat-icon-button
      matTooltip="Dismiss moderation task"
      matTooltipPosition="above"
      [disabled]="task === undefined || isModerated(task)"
      (click)="dismiss()"
    >
      <mat-icon>archive</mat-icon>
    </button>
    <button
      aria-label="Show less from this tutor"
      class="button"
      mat-icon-button
      matTooltip="Show less from this tutor"
      matTooltipPosition="above"
      [disabled]="task === undefined || isModerated(task)"
      (click)="showLess()"
    >
      <mat-icon>thumb_up</mat-icon>
    </button>
  } @else if (task.moderationType === 'escalation') {
    <button
      aria-label="Overturn"
      class="button"
      mat-icon-button
      matTooltip="Overturn"
      matTooltipPosition="above"
      [disabled]="task === undefined || isModerated(task)"
      (click)="overturn()"
    >
      <!-- <mat-icon>flag</mat-icon> -->
      <mat-icon>gavel</mat-icon>
    </button>

    <button
      aria-label="Upheld"
      class="button"
      mat-icon-button
      matTooltip="Upheld"
      matTooltipPosition="above"
      [disabled]="task === undefined || isModerated(task)"
      (click)="upheld()"
    >
      <!-- <mat-icon>thumb_up</mat-icon> -->
      <mat-icon>verified</mat-icon>
    </button>
  }
</span>
