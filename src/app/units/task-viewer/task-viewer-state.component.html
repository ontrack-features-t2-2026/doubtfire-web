@if (loading) {
  <div aria-busy="true" aria-label="Loading tasks" class="flex h-full gap-3 p-3" role="status">
    <ngx-skeleton-loader
      class="block h-full w-full max-w-[400px]"
      [theme]="{height: '100%', width: '100%', 'border-radius': '12px', margin: '0'}"
    ></ngx-skeleton-loader>
    <ngx-skeleton-loader
      class="hidden h-full flex-1 lg:block"
      [theme]="{height: '100%', width: '100%', 'border-radius': '12px', margin: '0'}"
    ></ngx-skeleton-loader>
  </div>
} @else if (loadFailed || !unit) {
  <div class="flex flex-col items-center px-4">
    <f-empty-state
      hint="Check your connection, then try again."
      icon="cloud_off"
      message="The unit's tasks did not load"
    ></f-empty-state>
    <button mat-stroked-button type="button" (click)="retryLoad()">Try again</button>
  </div>
} @else {
  <div>
    <!-- Wide Window Display -->
    <div fxFill fxHide fxLayout="column" fxShow.gt-sm>
      <div fxFill fxLayoutAlign="center stretch">
        <!-- Panel 1 -->
        <div #tasklistpanel class="vertical-panel min-w-12" id="tasklistpanel">
          <f-unit-task-list
            [mode]="'all-tasks'"
            [selectedTaskDefinition$]="selectedTaskDefinition$"
            [taskDefinitions]="unit.taskDefinitions"
          ></f-unit-task-list>
        </div>
        <div class="vertical-spacer"></div>
        <!-- Panel 2 -->
        <div class="vertical-panel size-full">
          @if (selectedTaskDefinition$ | async; as selectedTaskDef) {
            <div class="flex h-full flex-col">
              <div class="shrink">
                <f-task-details-view
                  [taskDef]="selectedTaskDef"
                  [unit]="unit"
                ></f-task-details-view>
              </div>
              <f-task-sheet-view class="h-full" [taskDef]="selectedTaskDef"> </f-task-sheet-view>
            </div>
          }
        </div>
      </div>
    </div>
    <!-- Narrow Window / Mobile Display -->
    <div #mobile fxFill fxHide fxLayout="row" fxShow.lt-md>
      <div class="vertical-panel mobile" [hidden]="selectedTaskDefinition$ | async">
        <f-unit-task-list
          [mode]="'all-tasks'"
          [selectedTaskDefinition$]="selectedTaskDefinition$"
          [taskDefinitions]="unit.taskDefinitions"
        ></f-unit-task-list>
      </div>
      <div fxFill fxLayout="column" fxLayoutAlign="space-between stretch" [hidden]="!taskSelected">
        <div class="flex items-center">
          <button
            aria-label="Back to task list"
            mat-icon-button
            matTooltip="Back to list"
            (click)="clearTaskSelection()"
          >
            <mat-icon>arrow_back_ios_new</mat-icon>
          </button>
        </div>
        <div class="vertical-panel mobile" fxFlex>
          <f-task-details-view [taskDef]="selectedTaskDef" [unit]="unit"></f-task-details-view>
        </div>
        <f-task-sheet-view class="h-full" [taskDef]="selectedTaskDef"> </f-task-sheet-view>
      </div>
    </div>
  </div>
}
