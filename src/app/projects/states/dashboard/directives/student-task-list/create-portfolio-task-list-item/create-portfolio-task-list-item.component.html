<a
  class="flex w-full items-center justify-between gap-2 text-inherit no-underline"
  [routerLink]="['/projects', project.id, 'portfolio']"
>
  <div class="flex min-w-0 flex-1 items-center gap-3">
    <div class="flex min-w-0 items-center gap-3 truncate text-ellipsis">
      <div class="flex flex-col justify-start truncate text-ellipsis">
        <div class="truncate text-ellipsis">Create Portfolio</div>

        <div class="flex min-w-0 items-center gap-0.5">
          <mat-icon class="size-6 flex-none scale-75 text-ot-muted">person</mat-icon>
          <div class="min-w-0 truncate text-[14px] text-ot-muted">
            Create and submit your portfolio
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- The same status column as the task rows in unit-task-list (their badge slot),
       so this circle lines up with the ones above it. -->
  <div class="mr-3 flex min-w-14 shrink-0 items-center justify-end pr-0.5">
    <status-icon [status]="status()"></status-icon>
  </div>
</a>
