<button
  class="max-w-full cursor-pointer rounded border-0 bg-transparent p-0 text-left text-inherit focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-current focus-visible:outline-solid"
  type="button"
  [attr.aria-label]="
    comment.commentType === 'pdf' ? 'View PDF attachment' : 'View image attachment'
  "
  (click)="openCommentsModal()"
>
  @if (comment.commentType === 'image' && resourceUrl) {
    <img alt="Image attachment preview" height="100%" width="100%" [src]="resourceUrl | safe" />
  }
  @if (comment.commentType === 'pdf') {
    <span class="flex items-center gap-1">
      <mat-icon aria-hidden="true">picture_as_pdf</mat-icon> view pdf
    </span>
  }
</button>
