name: Test CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Accessibility regression tests
        run: npm run test:a11y
      - name: Check theme first paint, compiled surfaces and contrast
        run: npx vitest run scripts/theme/theme-surfaces.spec.ts
      - run: npm run test:ci
